<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅游搭子测试 · 测测你是哪种旅行人格</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
  <style>
    :root {
      --sand-50: #FBF7F0;
      --sand-100: #F5EFE3;
      --sand-200: #E8DDC8;
      --sand-300: #D4C4A4;
      --ink-900: #1C1917;
      --ink-700: #3F3A33;
      --ink-500: #6B6358;
      --ink-300: #A89E8E;
      --sunset: #E85D3A;
      --sunset-light: #F4845F;
      --ocean: #2C6E7A;
      --ocean-light: #4A93A0;
      --moss: #6B8E4E;
      --paper-shadow: 0 2px 8px rgba(28, 25, 23, 0.08), 0 8px 24px rgba(28, 25, 23, 0.06);
      --paper-shadow-lg: 0 4px 16px rgba(28, 25, 23, 0.1), 0 16px 48px rgba(28, 25, 23, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-900);
      background: var(--sand-50);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(232, 93, 58, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(44, 110, 122, 0.06) 0%, transparent 50%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
    }

    /* ========== Welcome Screen ========== */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 0 20px;
      flex: 1;
      justify-content: center;
    }

    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--sand-100);
      border: 1px solid var(--sand-200);
      border-radius: 999px;
      font-size: 13px;
      color: var(--ink-500);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .welcome-badge svg { width: 14px; height: 14px; }

    .welcome-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 38px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--ink-900) 0%, var(--sunset) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-subtitle {
      font-size: 16px;
      color: var(--ink-500);
      margin-bottom: 36px;
      font-weight: 400;
      line-height: 1.6;
    }

    .welcome-illustration {
      width: 100%;
      max-width: 320px;
      margin-bottom: 36px;
      position: relative;
    }

    .stamp-row {
      display: flex;
      gap: 12px;
      margin-bottom: 36px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stamp {
      width: 72px;
      height: 88px;
      background: white;
      border: 2px dashed var(--sand-300);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      color: var(--ink-500);
      transform: rotate(-3deg);
      transition: transform 0.3s ease;
    }

    .stamp:nth-child(2) { transform: rotate(2deg); }
    .stamp:nth-child(3) { transform: rotate(-1deg); }
    .stamp:nth-child(4) { transform: rotate(3deg); }

    .stamp-icon {
      font-size: 28px;
      line-height: 1;
    }

    .stamp-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-700);
    }

    .welcome-stats {
      display: flex;
      gap: 24px;
      margin-bottom: 36px;
      justify-content: center;
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--sunset);
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--ink-500);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      padding: 16px 32px;
      background: var(--ink-900);
      color: var(--sand-50);
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(28, 25, 23, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(28, 25, 23, 0.25);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary svg { width: 18px; height: 18px; }

    .welcome-note {
      margin-top: 20px;
      font-size: 13px;
      color: var(--ink-300);
    }

    /* ========== Quiz Screen ========== */
    .quiz {
      display: none;
      flex-direction: column;
      flex: 1;
      padding-top: 12px;
    }

    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--sand-200);
      border-radius: 10px;
      font-size: 14px;
      color: var(--ink-500);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .back-btn:hover:not(:disabled) {
      background: var(--sand-100);
      color: var(--ink-700);
    }

    .back-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .back-btn svg { width: 16px; height: 16px; }

    .progress-info {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-500);
    }

    .progress-info strong {
      color: var(--sunset);
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
    }

    /* Journey progress bar */
    .journey-bar {
      position: relative;
      height: 8px;
      background: var(--sand-100);
      border-radius: 999px;
      margin-bottom: 32px;
      overflow: hidden;
    }

    .journey-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sunset-light), var(--sunset));
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .journey-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      background: var(--sand-50);
      border: 3px solid var(--sunset);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(232, 93, 58, 0.4);
    }

    .question-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--paper-shadow);
      margin-bottom: 24px;
      position: relative;
      border: 1px solid var(--sand-100);
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: var(--sand-200);
      border-radius: 2px;
      opacity: 0.5;
    }

    .question-dim {
      display: inline-block;
      padding: 4px 12px;
      background: var(--sand-100);
      border-radius: 999px;
      font-size: 12px;
      color: var(--ocean);
      font-weight: 500;
      margin-bottom: 16px;
    }

    .question-stem {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--ink-900);
      margin-bottom: 8px;
    }

    .question-hint {
      font-size: 13px;
      color: var(--ink-300);
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 16px 18px;
      background: var(--sand-50);
      border: 2px solid var(--sand-100);
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink-700);
      transition: all 0.2s ease;
      position: relative;
    }

    .option-btn:hover {
      border-color: var(--sunset-light);
      background: white;
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: var(--sunset);
      background: #FFF5F0;
      color: var(--ink-900);
      font-weight: 500;
    }

    .option-bullet {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--sand-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-500);
      transition: all 0.2s ease;
    }

    .option-btn:hover .option-bullet {
      background: var(--sunset-light);
      color: white;
    }

    .option-btn.selected .option-bullet {
      background: var(--sunset);
      color: white;
    }

    .option-text {
      flex: 1;
      padding-top: 1px;
    }

    .quiz-footer {
      margin-top: auto;
      padding-top: 20px;
    }

    .next-btn {
      width: 100%;
      padding: 16px;
      background: var(--sunset);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(232, 93, 58, 0.3);
    }

    .next-btn:hover:not(:disabled) {
      background: var(--sunset-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(232, 93, 58, 0.35);
    }

    .next-btn:disabled {
      background: var(--sand-200);
      color: var(--ink-300);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ========== Result Screen ========== */
    .result {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 40px;
    }

    .result-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .result-label {
      font-size: 13px;
      color: var(--ink-500);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .result-type-card {
      background: white;
      border-radius: 24px;
      padding: 36px 28px 28px;
      box-shadow: var(--paper-shadow-lg);
      width: 100%;
      text-align: center;
      position: relative;
      border: 1px solid var(--sand-100);
      margin-bottom: 24px;
      overflow: hidden;
    }

    .result-type-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--sunset), var(--ocean));
    }

    .result-emoji {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
      display: block;
    }

    .result-type-name {
      font-family: 'Noto Serif SC', serif;
      font-size: 32px;
      font-weight: 900;
      color: var(--ink-900);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .result-tagline {
      font-size: 15px;
      color: var(--sunset);
      font-weight: 500;
      margin-bottom: 20px;
    }

    .result-desc {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-700);
      margin-bottom: 24px;
      text-align: left;
      padding: 0 4px;
    }

    .match-rate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--sand-50);
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .match-label {
      font-size: 13px;
      color: var(--ink-500);
    }

    .match-value {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--sunset);
    }

    .match-bar-bg {
      flex: 1;
      height: 8px;
      background: var(--sand-200);
      border-radius: 999px;
      overflow: hidden;
    }

    .match-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sunset-light), var(--sunset));
      border-radius: 999px;
      transition: width 1s ease-out;
    }

    /* Top 5 types */
    .top5-section {
      width: 100%;
      margin-bottom: 24px;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink-900);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title svg { width: 20px; height: 20px; color: var(--sunset); }

    .top5-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top5-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: white;
      border-radius: 14px;
      box-shadow: var(--paper-shadow);
      border: 1px solid var(--sand-100);
    }

    .top5-rank {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--sand-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-500);
      flex-shrink: 0;
    }

    .top5-item.rank-1 .top5-rank {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
    }

    .top5-item.rank-2 .top5-rank {
      background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
      color: white;
    }

    .top5-item.rank-3 .top5-rank {
      background: linear-gradient(135deg, #CD7F32, #A0522D);
      color: white;
    }

    .top5-emoji {
      font-size: 24px;
      flex-shrink: 0;
    }

    .top5-info {
      flex: 1;
      min-width: 0;
    }

    .top5-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-900);
      margin-bottom: 2px;
    }

    .top5-tagline {
      font-size: 12px;
      color: var(--ink-500);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top5-score {
      font-size: 13px;
      font-weight: 600;
      color: var(--sunset);
      flex-shrink: 0;
    }

    /* Buddy match */
    .buddy-section {
      width: 100%;
      margin-bottom: 24px;
    }

    .buddy-cards {
      display: flex;
      gap: 12px;
    }

    .buddy-card {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: var(--paper-shadow);
      border: 1px solid var(--sand-100);
      transition: transform 0.2s ease;
    }

    .buddy-card:hover {
      transform: translateY(-4px);
    }

    .buddy-emoji {
      font-size: 36px;
      margin-bottom: 8px;
      display: block;
    }

    .buddy-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-900);
      margin-bottom: 4px;
    }

    .buddy-tagline {
      font-size: 11px;
      color: var(--ink-500);
      line-height: 1.4;
    }

    .buddy-label {
      display: inline-block;
      padding: 2px 8px;
      background: var(--sand-100);
      border-radius: 999px;
      font-size: 10px;
      color: var(--ocean);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Action buttons */
    .result-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-share {
      width: 100%;
      padding: 16px;
      background: var(--ocean);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(44, 110, 122, 0.3);
    }

    .btn-share:hover {
      background: var(--ocean-light);
      transform: translateY(-1px);
    }

    .btn-share svg { width: 18px; height: 18px; }

    .btn-restart {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--ink-500);
      border: 1px solid var(--sand-200);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn-restart:hover {
      background: var(--sand-100);
      color: var(--ink-700);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .screen-enter {
      animation: fadeInUp 0.5s ease-out;
    }

    .question-enter {
      animation: slideInRight 0.4s ease-out;
    }

    .question-back {
      animation: slideInLeft 0.4s ease-out;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 24px;
      background: var(--ink-900);
      color: white;
      border-radius: 999px;
      font-size: 14px;
      z-index: 1000;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Share modal */
    .share-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .share-modal.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .share-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
    }

    .share-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--sand-100);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-500);
    }

    .share-close:hover { background: var(--sand-200); }
    .share-close svg { width: 16px; height: 16px; }

    .share-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .share-desc {
      font-size: 14px;
      color: var(--ink-500);
      margin-bottom: 20px;
    }

    .share-link-box {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: var(--sand-50);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .share-link-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 13px;
      color: var(--ink-700);
      outline: none;
      font-family: inherit;
    }

    .share-copy-btn {
      padding: 8px 14px;
      background: var(--sunset);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .share-copy-btn:hover { background: var(--sunset-light); }

    .share-tip {
      font-size: 12px;
      color: var(--ink-300);
    }

    /* Loading */
    .loading-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--sand-200);
      border-top-color: var(--sunset);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 15px;
      color: var(--ink-500);
    }

    /* Responsive */
    @media (max-width: 380px) {
      .welcome-title { font-size: 32px; }
      .question-stem { font-size: 20px; }
      .result-type-name { font-size: 28px; }
      .stamp { width: 64px; height: 80px; }
    }

    @media (min-width: 768px) {
      .app {
        max-width: 520px;
        padding: 40px 24px 60px;
      }
    }
  </style>
</head>
<body>

    <!-- Welcome Screen -->

      <button class="btn-primary" id="startBtn">
        开始测试
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>

    <div class="quiz" id="quizScreen">
      <div class="quiz-header">
        <button class="back-btn" id="backBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </button>
        <div class="progress-info">

      <div class="question-card" id="questionCard">
        <span class="question-dim" id="questionDim">启程</span>

        <div class="options" id="optionsContainer"></div>

      <div class="quiz-footer">

        </button>

    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-spinner"></div>
      <p class="loading-text">正在分析你的旅行人格...</p>

    <!-- Result Screen -->
    <div class="result" id="resultScreen">

        <p class="result-label">你 的 旅 行 人 格</p>
      </div>

      <div class="result-type-card">
        <span class="result-emoji" id="resultEmoji">🧭</span>
        <h2 class="result-type-name" id="resultName">路痴本痴</h2>
        <p class="result-tagline" id="resultTagline">导航开了还是迷，但快乐不减</p>
        <p class="result-desc" id="resultDesc">你是那种跟着感觉走的人...</p>

        <div class="match-rate">
          <span class="match-label">匹配度</span>
          <div class="match-bar-bg">
            <div class="match-bar-fill" id="matchBar" style="width: 0%"></div>
          </div>
          <span class="match-value" id="matchValue">0%</span>
        </div>
      </div>

      <div class="top5-section">
        <h3 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>

            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <circle cx="9" cy="7" r="4"></circle>

          你的最佳旅行搭子
        </h3>
        <div class="buddy-cards" id="buddyCards"></div>
      </div>

      <div class="result-actions">
        <button class="btn-share" id="shareBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          分享你的旅行人格
        </button>
        <button class="btn-restart" id="restartBtn">再测一次</button>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="share-modal" id="shareModal">
    <div class="share-card">
      <button class="share-close" id="shareClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
      <h3 class="share-title">分享你的旅行人格</h3>
      <p class="share-desc" id="shareDesc">把结果分享给朋友，看看谁和你最搭</p>
      <div class="share-link-box">
        <input type="text" class="share-link-input" id="shareLink" readonly>
        <button class="share-copy-btn" id="copyBtn">复制</button>
      </div>
      <p class="share-tip">复制链接后发送给朋友，他们就能看到你的结果啦</p>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="engine.js"></script>
  <script src="data.js"></script>
  <script>
  (function() {
    'use strict';

    var TOTAL_QUESTIONS = 18;
    var data = window.TB_DATA;
    var engine = window.TravelBuddyEngine;
    var profiles = data.profiles;
    var questions = data.questions;
    var types = data.types;
    var dims = data.dims;

    // State
    var state = {
      step: 0,
      scores: {},
      answeredIds: [],
      history: [], // { questionId, choiceIdx, shuffledOpts }
      currentQuestion: null,
      currentShuffledOpts: [],
      selectedIdx: null,
      rngSeed: Math.random()
    };

    // Simple seeded RNG for reproducibility within a session
    function makeRng(seed) {
      var s = seed * 2147483647;
      return function() {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    var rng = makeRng(state.rngSeed);

    // Initialize scores
    function initScores() {
      state.scores = {};
      for (var i = 0; i < types.length; i++) {
        state.scores[types[i]] = 0;
      }
    }

    // Set rule priority
    engine.setRulePriority(questions, types);

    // DOM elements
    var welcomeScreen = document.getElementById('welcomeScreen');
    var quizScreen = document.getElementById('quizScreen');
    var loadingScreen = document.getElementById('loadingScreen');
    var resultScreen = document.getElementById('resultScreen');
    var startBtn = document.getElementById('startBtn');
    var backBtn = document.getElementById('backBtn');
    var nextBtn = document.getElementById('nextBtn');
    var currentStepEl = document.getElementById('currentStep');
    var totalStepsEl = document.getElementById('totalSteps');
    var progressFill = document.getElementById('progressFill');
    var questionDim = document.getElementById('questionDim');
    var questionStem = document.getElementById('questionStem');
    var optionsContainer = document.getElementById('optionsContainer');
    var questionCard = document.getElementById('questionCard');
    var restartBtn = document.getElementById('restartBtn');
    var shareBtn = document.getElementById('shareBtn');
    var shareModal = document.getElementById('shareModal');
    var shareClose = document.getElementById('shareClose');
    var shareLink = document.getElementById('shareLink');
    var copyBtn = document.getElementById('copyBtn');
    var shareDesc = document.getElementById('shareDesc');
    var toast = document.getElementById('toast');

    totalStepsEl.textContent = TOTAL_QUESTIONS;

    // Show screen
    function showScreen(screen) {
      welcomeScreen.style.display = 'none';
      quizScreen.style.display = 'none';
      loadingScreen.style.display = 'none';
      resultScreen.style.display = 'none';

      if (screen === 'welcome') {
        welcomeScreen.style.display = 'flex';
        welcomeScreen.classList.add('screen-enter');
      } else if (screen === 'quiz') {
        quizScreen.style.display = 'flex';
        quizScreen.classList.add('screen-enter');
      } else if (screen === 'loading') {
        loadingScreen.style.display = 'flex';
      } else if (screen === 'result') {
        resultScreen.style.display = 'flex';
        resultScreen.classList.add('screen-enter');
      }
    }

    // Start quiz
    function startQuiz() {
      initScores();
      state.step = 0;
      state.answeredIds = [];
      state.history = [];
      state.selectedIdx = null;
      rng = makeRng(Math.random()); // new seed each run
      loadNextQuestion();
      showScreen('quiz');
    }

    // Load next question
    function loadNextQuestion() {
      var q = engine.selectNext(questions, dims, state.answeredIds, state.scores, state.step, rng);
      if (!q) {
        showResult();
        return;
      }

      state.currentQuestion = q;
      state.currentShuffledOpts = engine.shuffleOptions(q.opts.slice());
      state.selectedIdx = null;

      renderQuestion(false);
      updateProgress();
    }

    // Go back to previous question
    function goBack() {
      if (state.history.length === 0) return;

      var last = state.history.pop();
      // Undo the score
      var q = findQuestion(last.questionId);
      if (q) {
        var w = q.opts[last.choiceIdx].weights;
        for (var i = 0; i < w.length; i++) {
          state.scores[w[i][0]] = (state.scores[w[i][0]] || 0) - w[i][1];
        }
      }

      // Remove from answered
      var idx = state.answeredIds.indexOf(last.questionId);
      if (idx > -1) state.answeredIds.splice(idx, 1);

      state.step--;
      state.currentQuestion = q;
      state.currentShuffledOpts = last.shuffledOpts;
      // Find selected index in shuffled order
      var selectedText = q.opts[last.choiceIdx].text;
      state.selectedIdx = null;
      for (var j = 0; j < last.shuffledOpts.length; j++) {
        if (last.shuffledOpts[j].text === selectedText) {
          state.selectedIdx = j;
          break;
        }
      }

      renderQuestion(true);
      updateProgress();
    }

    function findQuestion(id) {
      for (var i = 0; i < questions.length; i++) {
        if (questions[i].id === id) return questions[i];
      }
      return null;
    }

    // Render question
    function renderQuestion(isBack) {
      var q = state.currentQuestion;
      questionDim.textContent = q.dim;
      questionStem.textContent = q.stem;

      // Animation
      questionCard.classList.remove('question-enter', 'question-back');
      void questionCard.offsetWidth; // trigger reflow
      questionCard.classList.add(isBack ? 'question-back' : 'question-enter');

      // Render options
      optionsContainer.innerHTML = '';
      var opts = state.currentShuffledOpts;
      var letters = ['A', 'B', 'C', 'D'];

      for (var i = 0; i < opts.length; i++) {
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        if (state.selectedIdx === i) btn.classList.add('selected');
        btn.innerHTML =
          '<span class="option-bullet">' + letters[i] + '</span>' +
          '<span class="option-text">' + opts[i].text + '</span>';
        btn.addEventListener('click', (function(idx) {
          return function() { selectOption(idx); };
        })(i));
        optionsContainer.appendChild(btn);
      }

      // Update back button
      backBtn.disabled = state.history.length === 0;

      // Update next button
      nextBtn.disabled = state.selectedIdx === null;
      nextBtn.textContent = state.step >= TOTAL_QUESTIONS - 1 ? '查看结果' : '下一题';
    }

    // Select option
    function selectOption(idx) {
      state.selectedIdx = idx;

      // Update UI
      var btns = optionsContainer.querySelectorAll('.option-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('selected', i === idx);
      }

      nextBtn.disabled = false;
    }

    // Confirm answer and go next
    function confirmAnswer() {
      if (state.selectedIdx === null) return;

      var q = state.currentQuestion;
      var chosenOpt = state.currentShuffledOpts[state.selectedIdx];
      var choiceIdx = -1;
      for (var i = 0; i < q.opts.length; i++) {
        if (q.opts[i].text === chosenOpt.text) {
          choiceIdx = i;
          break;
        }
      }

      // Save history
      state.history.push({
        questionId: q.id,
        choiceIdx: choiceIdx,
        shuffledOpts: state.currentShuffledOpts.slice()
      });

      // Apply score
      engine.applyAnswer(state.scores, q, choiceIdx);
      state.answeredIds.push(q.id);
      state.step++;

      if (state.step >= TOTAL_QUESTIONS) {
        showResult();
      } else {
        loadNextQuestion();
      }
    }

    // Update progress bar
    function updateProgress() {
      var pct = ((state.step + 1) / TOTAL_QUESTIONS) * 100;
      progressFill.style.width = pct + '%';
      currentStepEl.textContent = state.step + 1;
    }

    // Show result
    function showResult() {
      showScreen('loading');

      setTimeout(function() {
        var winner = engine.calcWinner(state.scores);
        var answeredQs = state.history.map(function(h) {
          return findQuestion(h.questionId);
        }).filter(function(q) { return q; });

        var matchRate = engine.matchRate(state.scores, winner.winner, answeredQs);

        // Get top 5
        var scoreArr = [];
        for (var t in state.scores) {
          scoreArr.push([t, state.scores[t]]);
        }
        scoreArr.sort(function(a, b) { return b[1] - a[1]; });
        var top5 = scoreArr.slice(0, 5);

        // Render result
        renderResult(winner.winner, matchRate, top5);

        // Update URL hash for sharing
        var path = state.history.map(function(h) { return [h.questionId, h.choiceIdx]; });
        var hash = engine.encodeShare(winner.winner, path);
        if (history.replaceState) {
          history.replaceState(null, '', hash);
        }

        showScreen('result');

        // Animate match bar
        setTimeout(function() {
          document.getElementById('matchBar').style.width = matchRate + '%';
          animateNumber('matchValue', 0, matchRate, 1000, '%');
        }, 300);
      }, 800);
    }

    function animateNumber(id, from, to, duration, suffix) {
      var el = document.getElementById(id);
      var start = Date.now();
      function tick() {
        var elapsed = Date.now() - start;
        var progress = Math.min(elapsed / duration, 1);
        // easeOut
        progress = 1 - Math.pow(1 - progress, 3);
        var val = from + (to - from) * progress;
        el.textContent = Math.round(val * 10) / 10 + (suffix || '');
        if (progress < 1) requestAnimationFrame(tick);
      }
      tick();
    }

    // Render result page
    function renderResult(winner, matchRate, top5) {
      var profile = profiles[winner] || {};

      document.getElementById('resultEmoji').textContent = profile.emoji || '🌟';
      document.getElementById('resultName').textContent = winner;
      document.getElementById('resultTagline').textContent = profile.tagline || '';
      document.getElementById('resultDesc').textContent = profile.desc || '';

      // Top 5
      var top5List = document.getElementById('top5List');
      top5List.innerHTML = '';
      for (var i = 0; i < top5.length; i++) {
        var tName = top5[i][0];
        var tScore = top5[i][1];
        var tp = profiles[tName] || {};
        var item = document.createElement('div');
        item.className = 'top5-item rank-' + (i + 1);
        item.innerHTML =
          '<div class="top5-rank">' + (i + 1) + '</div>' +
          '<span class="top5-emoji">' + (tp.emoji || '🌟') + '</span>' +
          '<div class="top5-info">' +
            '<div class="top5-name">' + tName + '</div>' +
            '<div class="top5-tagline">' + (tp.tagline || '') + '</div>' +
          '</div>' +
          '<div class="top5-score">' + tScore + '分</div>';
        top5List.appendChild(item);
      }

      // Buddies
      var buddyCards = document.getElementById('buddyCards');
      buddyCards.innerHTML = '';
      var buddies = profile.buddy || [];
      for (var j = 0; j < Math.min(buddies.length, 2); j++) {
        var bName = buddies[j];
        var bp = profiles[bName] || {};
        var card = document.createElement('div');
        card.className = 'buddy-card';
        card.innerHTML =
          '<span class="buddy-emoji">' + (bp.emoji || '🌟') + '</span>' +
          '<div class="buddy-name">' + bName + '</div>' +
          '<div class="buddy-tagline">' + (bp.tagline || '') + '</div>' +
          '<span class="buddy-label">最佳搭子</span>';
        buddyCards.appendChild(card);
      }

      // Share desc
      shareDesc.textContent = '我是「' + winner + '」' + (profile.tagline ? '——' + profile.tagline : '') + '，快来测测你是哪种旅行人格！';
    }

    // Share
    function openShare() {
      var url = window.location.href;
      shareLink.value = url;
      shareModal.classList.add('show');
    }

    function closeShare() {
      shareModal.classList.remove('show');
    }

    function copyLink() {
      shareLink.select();
      try {
        document.execCommand('copy');
        showToast('链接已复制');
      } catch (e) {
        showToast('复制失败，请手动复制');
      }
    }

    // Toast
    var toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }

    // Restart
    function restart() {
      if (history.replaceState) {
        history.replaceState(null, '', window.location.pathname);
      }
      showScreen('welcome');
    }

    // Check for share hash on load
    function checkShareHash() {
      if (!window.location.hash) return false;
      var decoded = engine.decodeShare(window.location.hash);
      if (!decoded.resultId) return false;

      // If there's a full path, replay it
      if (decoded.path && decoded.path.length > 0) {
        initScores();
        state.history = [];
        state.answeredIds = [];
        for (var i = 0; i < decoded.path.length; i++) {
          var qid = decoded.path[i][0];
          var cidx = decoded.path[i][1];
          var q = findQuestion(qid);
          if (q) {
            engine.applyAnswer(state.scores, q, cidx);
            state.answeredIds.push(qid);
            state.history.push({
              questionId: qid,
              choiceIdx: cidx,
              shuffledOpts: q.opts.slice()
            });
          }
        }
        state.step = decoded.path.length;

        var winner = engine.calcWinner(state.scores);
        var answeredQs = state.history.map(function(h) {
          return findQuestion(h.questionId);
        }).filter(function(q) { return q; });
        var matchRate = engine.matchRate(state.scores, winner.winner, answeredQs);

        var scoreArr = [];
        for (var t in state.scores) {
          scoreArr.push([t, state.scores[t]]);
        }
        scoreArr.sort(function(a, b) { return b[1] - a[1]; });
        var top5 = scoreArr.slice(0, 5);

        renderResult(winner.winner, matchRate, top5);
        showScreen('result');

        setTimeout(function() {
          document.getElementById('matchBar').style.width = matchRate + '%';
          animateNumber('matchValue', 0, matchRate, 1000, '%');
        }, 300);

        return true;
      }

      return false;
    }

    // Event listeners
    startBtn.addEventListener('click', startQuiz);
    backBtn.addEventListener('click', goBack);
    nextBtn.addEventListener('click', confirmAnswer);
    restartBtn.addEventListener('click', restart);
    shareBtn.addEventListener('click', openShare);
    shareClose.addEventListener('click', closeShare);
    copyBtn.addEventListener('click', copyLink);

    shareModal.addEventListener('click', function(e) {
      if (e.target === shareModal) closeShare();
    });

    // Keyboard support
    document.addEventListener('keydown', function(e) {
      if (quizScreen.style.display !== 'flex') return;

      if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
        if (!backBtn.disabled) goBack();
      } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
        if (!nextBtn.disabled) confirmAnswer();
      } else if (e.key >= '1' && e.key <= '4') {
        var idx = parseInt(e.key) - 1;
        if (idx < state.currentShuffledOpts.length) {
          selectOption(idx);
        }
      }
    });

    // Initialize
    if (!checkShareHash()) {
      showScreen('welcome');
    }
  })();
  </script>
</body>
</html>

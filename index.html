<style>
:root{--paper:#faf6ef;--paper-dark:#f0e8da;--ink:#2c3e50;--ink-light:#5a6c7d;--orange:#e8743b;--orange-light:#f5a623;--blue:#3a6b8a;--card:#fffaf2;--shadow:0 2px 12px rgba(44,62,80,.08);--shadow-lg:0 8px 32px rgba(44,62,80,.12);--radius:16px}

body{font-family:'Noto Sans SC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
.serif{font-family:'Noto Serif SC',serif}

/* Welcome */
#welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,#faf6ef,#f5ede0);position:relative}
#welcome::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(232,116,59,.06) 0,transparent 50%),radial-gradient(circle at 80% 70%,rgba(58,107,138,.06) 0,transparent 50%);pointer-events:none}
.welcome-card{max-width:480px;width:100%;text-align:center;position:relative;z-index:1}
.welcome-stamp{display:inline-block;padding:6px 20px;border:2px solid var(--orange);border-radius:4px;color:var(--orange);font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:24px;transform:rotate(-3deg);font-family:'Noto Serif SC',serif}
.welcome-title{font-family:'Noto Serif SC',serif;font-size:42px;font-weight:900;color:var(--ink);line-height:1.2;margin-bottom:12px}
.welcome-sub{font-size:16px;color:var(--ink-light);line-height:1.6;margin-bottom:32px}
.welcome-types{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px}
.type-chip{padding:4px 12px;background:var(--card);border:1px solid var(--paper-dark);border-radius:20px;font-size:12px;color:var(--ink-light)}
.start-btn{display:inline-block;padding:16px 48px;background:var(--ink);color:#fff;border:none;border-radius:30px;font-size:18px;font-weight:700;font-family:'Noto Serif SC',serif;cursor:pointer;transition:all .3s;box-shadow:0 4px 16px rgba(44,62,80,.2)}
.start-btn:hover{background:var(--orange);transform:translateY(-2px)}
.welcome-meta{margin-top:24px;font-size:13px;color:var(--ink-light)}
.welcome-meta span{margin:0 8px}

/* Quiz */
#quiz{display:none;min-height:100vh;padding:20px}
.quiz-header{max-width:560px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between}
.quiz-header-left{display:flex;gap:10px;align-items:center}
.quiz-back{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card);border:1px solid var(--paper-dark);border-radius:20px;font-size:14px;color:var(--ink-light);cursor:pointer;transition:all .2s}
.quiz-back:hover{color:var(--orange);border-color:var(--orange)}
.quiz-back.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.quiz-back svg{width:16px;height:16px}
.quiz-restart{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card);border:1px solid var(--paper-dark);border-radius:20px;font-size:14px;color:var(--ink-light);cursor:pointer;transition:all .2s}
.quiz-restart:hover{color:var(--blue);border-color:var(--blue)}
.quiz-restart svg{width:16px;height:16px}
.quiz-progress-text{font-size:13px;color:var(--ink-light);font-weight:500}
.progress-bar{max-width:560px;margin:0 auto 24px;height:6px;background:var(--paper-dark);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-light));border-radius:3px;transition:width .4s ease}
.quiz-container{max-width:560px;margin:0 auto;background:var(--card);border-radius:var(--radius);padding:32px 24px;box-shadow:var(--shadow)}
.quiz-dim{display:inline-block;padding:4px 12px;background:var(--paper-dark);border-radius:12px;font-size:12px;color:var(--ink-light);margin-bottom:16px}
.quiz-stem{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:24px}
.opt-list{display:flex;flex-direction:column;gap:12px}
.opt-item{padding:16px 20px;background:var(--paper);border:2px solid transparent;border-radius:12px;font-size:16px;color:var(--ink);cursor:pointer;transition:all .2s;line-height:1.5;display:flex;align-items:flex-start;gap:12px;position:relative}
.opt-item:hover{border-color:var(--orange);background:#fff;transform:translateX(4px)}
.opt-item.prev-selected{border-color:var(--blue);border-style:dashed;background:#f0f7fb}
.opt-item.prev-selected::after{content:'上次选择';position:absolute;top:-8px;right:12px;padding:2px 8px;background:var(--blue);color:#fff;font-size:10px;border-radius:8px;font-weight:500}
.opt-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--paper-dark);color:var(--ink-light);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s}
.opt-item:hover .opt-num{background:var(--orange);color:#fff}
.opt-item.prev-selected .opt-num{background:var(--blue);color:#fff}

/* Result */

.result-stamp{display:inline-block;padding:4px 16px;border:1.5px solid rgba(255,255,255,.4);border-radius:4px;font-size:11px;letter-spacing:2px;margin-bottom:16px;color:rgba(255,255,255,.8);transform:rotate(-2deg)}

.result-rate-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:var(--paper);border-radius:12px}
.rate-circle{flex-shrink:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--rate)*1%),var(--paper-dark) 0);display:flex;align-items:center;justify-content:center;position:relative}

.rate-num{position:relative;z-index:1;font-size:18px;font-weight:900;color:var(--orange)}
.rate-label{font-size:13px;color:var(--ink-light);line-height:1.4}
.rate-label strong{color:var(--ink);font-size:15px}
.result-desc{font-size:15px;color:var(--ink);line-height:1.7;margin-bottom:24px;padding:16px;background:var(--paper);border-radius:12px;border-left:3px solid var(--orange)}
.result-section-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.buddy-list{display:flex;gap:12px;margin-bottom:24px}
.buddy-card{flex:1;padding:16px 12px;background:var(--paper);border-radius:12px;text-align:center}
.buddy-emoji{font-size:28px;margin-bottom:6px}
.buddy-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
.buddy-tag{font-size:11px;color:var(--ink-light);line-height:1.3}
.top5-list{margin-bottom:24px}
.top5-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;margin-bottom:4px;transition:background .2s}
.top5-item:hover{background:var(--paper)}
.top5-rank{font-size:14px;font-weight:900;color:var(--orange);width:20px}
.top5-name{flex:1;font-size:14px;color:var(--ink)}
.top5-bar{flex-shrink:0;width:80px;height:6px;background:var(--paper-dark);border-radius:3px;overflow:hidden}
.top5-fill{height:100%;background:var(--orange);border-radius:3px}
.top5-score{font-size:12px;color:var(--ink-light);width:28px;text-align:right}
.result-actions{display:flex;gap:12px;padding:0 24px 24px}
.action-btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Noto Sans SC',sans-serif}
.action-btn.share{background:var(--blue);color:#fff}
.action-btn.share:hover{background:#2c5570}
.action-btn.retry{background:var(--paper-dark);color:var(--ink)}
.action-btn.retry:hover{background:var(--paper)}

/* Screenshot toast */
#screenshotToast{display:none;position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--ink);color:#fff;border-radius:24px;font-size:14px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#screenshotToast.show{display:block;animation:fadeIn .3s ease}

/* Animations */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Responsive */
@media(max-width:400px){.welcome-title{font-size:32px}.quiz-stem{font-size:19px}.opt-item{font-size:14px;padding:14px 16px}.result-type{font-size:24px}.buddy-list{flex-direction:column}.quiz-header-left{gap:6px}.quiz-back,.quiz-restart{padding:6px 10px;font-size:12px}.quiz-back svg,.quiz-restart svg{width:14px;height:14px}.quiz-progress-text{font-size:11px}}

<script>
/**
 * engine_v6.js — 旅游搭子测试计分引擎（与 Python engine_v6.py 同源 questions.json）
 * CAT 选路(固定18) + 支持度加权破平 + shuffle + 匹配度 + 分享编码
 * 浏览器与 Node 通用；Node 下挂到 module.exports 供 KS 一致性检验
 */
(function (root, factory) {
  if (typeof module !== "undefined" && module.exports) {
    module.exports = factory();
  } else {
    root.TravelBuddyEngine = factory();
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  var ENGINE = {};

  // 规则集（与 Python 同源，48类型全覆盖）
  var RULE_SETS = [
    ["路痴本痴","领航员","出门困难户","倒霉蛋"],
    ["出片者","打卡狂魔","纪录片导演"],
    ["纪录片导演","讲解器转世","资深剧评人"],
    ["美食雷达","路边摊冒险家","中餐续命者"],
    ["中餐续命者","外卖鉴赏家","思乡者"],
    ["躺平仙人","罗马觉皇","思乡者","时差冤魂"],
    ["夜生活之王","时差冤魂","特种兵王"],
    ["精算师","AA活算盘","人型汇率计算器","现金乞丐"],
    ["社牛天花板","全村的希望","甜蜜连麦者"],
    ["赛博浪人","Wi-Fi搜寻者","手机焊脸上"],
    ["多啦A梦","失物招领者","补水狂魔"],
    ["思乡者","中餐续命者","婴幼儿"],
    ["公司顶梁柱","手机焊脸上","防盗战神"],
    ["公路之王","领航员","特种兵王","行走的攻略"],
    ["文化震惊体","肢体语言大师","假装听懂的人","讲解器转世"],
    ["购物狂魔","抽象艺术家","吟游诗人"],
    ["临时起意派","鸽子成精"],
    ["修行者","猫门信徒"],
    ["行走的攻略","避雷针"],
    ["避雷针","倒霉蛋","防盗战神"],
  ];
  var RS_SETS = RULE_SETS.map(function (a) { var s = {}; for (var i=0;i<a.length;i++) s[a[i]]=1; return s; });

  // RULE_PRIORITY 由 setRulePriority(questions) 注入（覆盖反序）
  var RULE_PRIORITY = {};

  ENGINE.setRulePriority = function (questions, types) {
    var cov = {};
    for (var i=0;i<types.length;i++) cov[types[i]]=0;
    for (var q=0;q<questions.length;q++){
      var opts=questions[q].opts;
      for (var o=0;o<opts.length;o++){
        var w=opts[o].weights;
        for (var k=0;k<w.length;k++){ cov[w[k][0]] += w[k][1]; }
      }
    }
    var ranked = types.slice().sort(function(a,b){ return cov[a]-cov[b]; });
    RULE_PRIORITY = {};
    for (var i=0;i<ranked.length;i++){ RULE_PRIORITY[ranked[i]] = ranked.length - i; }
  };

  function supportOf(t) {
    var n = 0;
    for (var i=0;i<RS_SETS.length;i++){ if (RS_SETS[i][t]) n++; }
    return n;
  }

  ENGINE.calcWinner = function (scores) {
    var keys = Object.keys(scores);
    var arr = keys.map(function(k){ return [k, scores[k]]; });
    arr.sort(function(a,b){ return b[1]-a[1]; });
    var top = arr[0][1];
    var tied = arr.filter(function(e){ return e[1]===top; }).map(function(e){ return e[0]; });
    if (tied.length === 1) return { winner: tied[0], resolvedBy: "score" };
    var support = {};
    for (var i=0;i<tied.length;i++){
      var t = tied[i];
      support[t] = supportOf(t) + (RULE_PRIORITY[t]||0)*0.001;
    }
    var mx = -1;
    for (var k in support){ if (support[k]>mx) mx=support[k]; }
    var best = tied.filter(function(t){ return Math.abs(support[t]-mx)<0.0001; });
    if (best.length===1) return { winner: best[0], resolvedBy: "support" };
    best.sort(function(a,b){ return (RULE_PRIORITY[b]||0)-(RULE_PRIORITY[a]||0); });
    return { winner: best[0], resolvedBy: "support_pri" };
  };

  ENGINE.selectNext = function (questions, dims, answeredIds, excludeIds, scores, step, rng) {
    var recentDims = [];
    for (var i=Math.max(0,answeredIds.length-2); i<answeredIds.length; i++){
      for (var q=0;q<questions.length;q++){
        if (questions[q].id===answeredIds[i]){ recentDims.push(questions[q].dim); break; }
      }
    }
    // 排除集用 excludeIds（所有曾展示过的题目，回退不收缩），杜绝已答/已见题目重现
    var used = {}; for (var i=0;i<excludeIds.length;i++) used[excludeIds[i]]=1;
    var layer = step<10 ? "core" : (step<16 ? "select" : "explore");
    function pool(filter){
      return questions.filter(function(q){
        return q.layer===layer && !used[q.id] && (filter? filter(q): true);
      });
    }
    var cands = pool(function(q){ return recentDims.indexOf(q.dim)===-1; });
    if (!cands.length) cands = pool();
    if (!cands.length) cands = questions.filter(function(q){ return !used[q.id]; });
    if (!cands.length) return null;

    if (step < 10) {
      var coveredDims = {};
      for (var ai=0; ai<answeredIds.length; ai++){
        for (var aq=0; aq<questions.length; aq++){
          if (questions[aq].id===answeredIds[ai]){ coveredDims[questions[aq].dim]=1; break; }
        }
      }
      for (var d=0; d<dims.length; d++){

8};


window.TBQuiz = (function() {
  var state = null;

  function selectNext() {
    var s = state;
    if (s.step >= 18) { s.currentQ = null; return; }
    // Initialize rule priority on first call
    if (!s._ruleInit) {
      TravelBuddyEngine.setRulePriority(TB_DATA.questions, TB_DATA.types);
      s._ruleInit = true;
    }
    s.currentQ = TravelBuddyEngine.selectNext(
      TB_DATA.questions, TB_DATA.dims, s.history.map(function(h){return h.qId;}), s.seenIds, s.scores, s.step, Math.random
    );
    if (!s.currentQ) return;
    s.shuffledOpts = TravelBuddyEngine.shuffleOptions(s.currentQ.opts);
    // 记录曾展示过的题目，回退不收缩，作为后续选路排除集
    if (s.seenIds.indexOf(s.currentQ.id) === -1) s.seenIds.push(s.currentQ.id);
  }

  function getCurrent() {
    var s = state;
    if (!s || !s.currentQ) return null;
    return {
      step: s.step + 1,
      total: 18,
      progress: Math.round((s.step / 18) * 100),
      stem: s.currentQ.stem,
      dim: s.currentQ.dim,
      options: s.shuffledOpts.map(function(o) { return o.text; }),
      canGoBack: s.history.length > 0,
      prevSelectedIdx: (s._prevSelectedIdx !== undefined ? s._prevSelectedIdx : -1)
    };
  }

  return {
    start: function() {
      state = {
        scores: {}, history: [], step: 0,
        currentQ: null, shuffledOpts: null, _ruleInit: false, seenIds: []
      };
      selectNext();
      return getCurrent();
    },

    current: function() { return getCurrent(); },

    answer: function(displayedIdx) {
      var s = state;
      if (!s || !s.currentQ) return null;
      s._prevSelectedIdx = undefined;
      var opt = s.shuffledOpts[displayedIdx];
      var origIdx = s.currentQ.opts.indexOf(opt);
      TravelBuddyEngine.applyAnswer(s.scores, s.currentQ, origIdx);
      s.history.push({
        qId: s.currentQ.id,
        origIdx: origIdx,
        shuffledOpts: s.shuffledOpts,
        currentQ: s.currentQ
      });
      s.step++;
      selectNext();
      return getCurrent();
    },

    back: function() {
      var s = state;
      if (!s || s.history.length === 0) return null;
      var last = s.history.pop();
      // Undo the answer
      var w = last.currentQ.opts[last.origIdx].weights;
      for (var i = 0; i < w.length; i++) {
        s.scores[w[i][0]] = (s.scores[w[i][0]] || 0) - w[i][1];
        if (s.scores[w[i][0]] <= 0) delete s.scores[w[i][0]];
      }
      s.step--;
      // Restore the previous question with its original shuffled options
      s.currentQ = last.currentQ;
      s.shuffledOpts = last.shuffledOpts;
      // Track which option was previously selected for UI marking
      var prevOpt = last.currentQ.opts[last.origIdx];
      s._prevSelectedIdx = last.shuffledOpts.indexOf(prevOpt);
      return getCurrent();
    },

    isFinished: function() {
      return state && (state.step >= 18 || !state.currentQ);
    },

    result: function() {
      var s = state;
      if (!s || s.step < 1) return null;
      var w = TravelBuddyEngine.calcWinner(s.scores);
      var answeredQs = s.history.map(function(h){return h.currentQ;});
      var rate = TravelBuddyEngine.matchRate(s.scores, w.winner, answeredQs);
      var profile = TB_DATA.profiles[w.winner] || {emoji:"🎯",tagline:"神秘旅人",desc:"你的旅行风格独一无二。",buddy:[]};
      var ranked = Object.keys(s.scores).map(function(k) {
        return { type: k, score: s.scores[k] };
      }).sort(function(a, b) { return b.score - a.score; });
      var buddies = (profile.buddy || []).map(function(name) {
        var p = TB_DATA.profiles[name] || {emoji:"🧳",tagline:""};
        return { name: name, emoji: p.emoji, tagline: p.tagline };
      });
      var path = s.history.map(function(h){return [h.qId, h.origIdx];});
      var share = TravelBuddyEngine.encodeShare(w.winner, path);
      return {
        winner: w.winner,
        resolvedBy: w.resolvedBy,
        matchRate: rate,
        profile: profile,
        buddies: buddies,
        shareLink: share,
        top5: ranked.slice(0, 5),
        totalQuestions: 18
      };
    },

    replay: function(path) {
      state = {
        scores: {}, history: [], step: 0,
        currentQ: null, shuffledOpts: null, _ruleInit: false, seenIds: []
      };
      var s = state;
      TravelBuddyEngine.setRulePriority(TB_DATA.questions, TB_DATA.types);
      s._ruleInit = true;
      for (var i = 0; i < path.length; i++) {
        var qId = path[i][0];
        var origIdx = path[i][1];
        var q = null;
        for (var j = 0; j < TB_DATA.questions.length; j++) {
          if (TB_DATA.questions[j].id === qId) { q = TB_DATA.questions[j]; break; }
        }
        if (!q) continue;
        TravelBuddyEngine.applyAnswer(s.scores, q, origIdx);
        s.history.push({qId: qId, origIdx: origIdx, shuffledOpts: q.opts, currentQ: q});
        if (s.seenIds.indexOf(qId) === -1) s.seenIds.push(qId);
        s.step++;
      }
      return this.result();
    },

    decodeShare: function(hash) {
      return TravelBuddyEngine.decodeShare(hash);
    },

    getProfile: function(typeName) {
      return TB_DATA.profiles[typeName] || null;
    },

    allTypes: function() {
      return TB_DATA.types.map(function(t) {
        var p = TB_DATA.profiles[t] || {};
        return { name: t, emoji: p.emoji || '🎯', tagline: p.tagline || '' };
      });
    }
  };
})();

function showPage(id){var modes={welcome:'flex',quiz:'block',result:'block'};var p=['welcome','quiz','result'];for(var i=0;i<p.length;i++)document.getElementById(p[i]).style.display=p[i]===id?modes[p[i]]:'none'}

function startQuiz(){TBQuiz.start();showPage('quiz');renderQuestion()}

function renderQuestion(){
  var q=TBQuiz.current();
  if(!q||TBQuiz.isFinished()){showResult();return}
  document.getElementById('progressFill').style.width=(q.step/q.total*100)+'%';
  document.getElementById('progressText').textContent=q.step+' / '+q.total;
  var backBtn=document.getElementById('backBtn');
  if(q.canGoBack)backBtn.classList.remove('disabled');else backBtn.classList.add('disabled');
  document.getElementById('quizDim').textContent=q.dim;
  document.getElementById('quizStem').textContent=q.stem;
  var html='';
  for(var i=0;i<q.options.length;i++){
    var cls='opt-item slide-in';
    if(q.prevSelectedIdx===i)cls+=' prev-selected';
    html+='<div class="'+cls+'" onclick="selectOption('+i+')" style="animation-delay:'+(i*0.05)+'s">';
    html+='<div class="opt-num">'+(i+1)+'</div><div>'+q.options[i]+'</div></div>';
  }
  document.getElementById('optList').innerHTML=html;
  var c=document.getElementById('quizContainer');c.classList.remove('fade-in');void c.offsetWidth;c.classList.add('fade-in');
}

function selectOption(idx){
  var items=document.querySelectorAll('.opt-item');
  if(items[idx])items[idx].classList.add('selected');
  setTimeout(function(){TBQuiz.answer(idx);renderQuestion()},200);
}

function goBack(){TBQuiz.back();renderQuestion()}

function restartQuiz(){TBQuiz.start();showPage('welcome')}

function renderResult(r){
  if(!r)return;
  showPage('result');
  var p=r.profile||{};
  document.getElementById('resultEmoji').textContent=p.emoji||'🎯';
  document.getElementById('resultType').textContent=r.winner;
  document.getElementById('resultTagline').textContent=p.tagline||'';
  document.getElementById('resultDesc').textContent=p.desc||'';
  var rate=Math.round(r.matchRate||0);
  document.getElementById('rateCircle').style.setProperty('--rate',rate);
  document.getElementById('rateNum').textContent=rate+'%';
  var bh='',buddies=r.buddies||[];
  for(var i=0;i<buddies.length;i++){
    bh+='<div class="buddy-card"><div class="buddy-emoji">'+(buddies[i].emoji||'🧳')+'</div>';
    bh+='<div class="buddy-name">'+buddies[i].name+'</div>';
    bh+='<div class="buddy-tag">'+(buddies[i].tagline||'')+'</div></div>';
  }
  document.getElementById('buddyList').innerHTML=bh;
  var top5=r.top5||[],mx=top5.length>0?top5[0].score:1,th='';
  for(var i=0;i<top5.length;i++){
    var pct=Math.round((top5[i].score/mx)*100);
    th+='<div class="top5-item"><div class="top5-rank">'+(i+1)+'</div>';
    th+='<div class="top5-name">'+top5[i].type+'</div>';
    th+='<div class="top5-bar"><div class="top5-fill" style="width:'+pct+'%"></div></div>';
    th+='<div class="top5-score">'+top5[i].score+'</div></div>';
  }
  document.getElementById('top5List').innerHTML=th;
}

function showResult(){renderResult(TBQuiz.result())}

function takeScreenshot(){
  var el=document.getElementById('resultContainer');
  var toast=document.getElementById('screenshotToast');
  toast.textContent='正在生成截图...';
  toast.classList.add('show');
  html2canvas(el,{backgroundColor:'#faf6ef',scale:2,useCORS:true,logging:false}).then(function(canvas){
    var link=document.createElement('a');
    link.download='旅游搭子测试_'+(document.getElementById('resultType').textContent||'结果')+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast.textContent='截图已保存';
    setTimeout(function(){toast.classList.remove('show')},2000);
  }).catch(function(err){
    toast.textContent='截图失败，请手动截屏';
    setTimeout(function(){toast.classList.remove('show')},2000);
  });
}

function restart(){TBQuiz.start();showPage('welcome')}

document.addEventListener('keydown',function(e){
  if(document.getElementById('quiz').style.display==='block'){
    if(e.key>='1'&&e.key<='4'){var idx=parseInt(e.key)-1;var items=document.querySelectorAll('.opt-item');if(items[idx])selectOption(idx)}
    else if(e.key==='ArrowLeft')goBack();
  }
});

(function init(){
  var types=TB_DATA.types.slice();
  // 全随机洗牌，每次进入首页展示的类型都不同
  for(var i=types.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=types[i];types[i]=types[j];types[j]=t;}
  var chips='';
  for(var i=0;i<Math.min(12,types.length);i++){
    var p=TB_DATA.profiles[types[i]]||{};
    chips+='<span class="type-chip">'+(p.emoji||'🎯')+' '+types[i]+'</span>';
  }
  chips+='<span class="type-chip">...共48种</span>';
  document.getElementById('welcomeTypes').innerHTML=chips;
})();
</script>
</body>
</html>
